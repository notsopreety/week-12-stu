<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio - Week 12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Samir's Portfolio</h1>
    <button id="dark-mode-toggle">Toggle Dark Mode</button>
  </header>

  <main>
    <!-- Greeting Section -->
    <section id="greeting-section">
      <div id="greeting-message"></div>
    </section>

    <!-- Step 1: Hobby/Skill List Rendering -->
    <section id="hobbies-section">
      <h2>My Hobbies & Skills</h2>
      <div id="hobby-list"></div>
    </section>

    <!-- Step 2: Hobby Gallery Extension -->
    <section id="gallery-section">
      <h2>Hobby Gallery</h2>
      <div class="gallery-container">
        <img id="gallery-image" src="https://picsum.photos/id/10/600/400" alt="Hobby Gallery Image">
        <br>
        <button id="next-photo-btn">Next Photo</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
